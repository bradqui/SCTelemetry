# The fleet hub (see deploy/README.md).
#
#   cp .env.example .env   # then fill it in
#   docker compose pull && docker compose up -d   # the released image
#   docker compose logs hub   # the first time: the link that creates the admin account
#
# HUB_VERSION in .env pins a release (e.g. 0.2.0; default: latest). To build from this
# checkout instead: docker compose up -d --build
#
# The port is published on 127.0.0.1 only: put a reverse proxy with https in front
# (Caddy, nginx, Apache; examples in deploy/README.md).

services:
  hub:
    image: ghcr.io/bradqui/starglance-hub:${HUB_VERSION:-latest}
    build: # only with --build: from this checkout
      context: ..
      dockerfile: hub/Dockerfile
    container_name: starglance-hub
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - hub-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hub-data:
