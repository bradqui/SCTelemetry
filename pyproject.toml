[project]
name = "sctelemetry"
version = "0.1.0"
description = "Star Citizen org fleet telemetry: Windows agent, hub, and tools"
readme = "README.md"
# The agent and hub target 3.12; anything the ButlerBot cog imports must also run on 3.11.
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10",
    "grpcio>=1.66",
    "grpcio-reflection>=1.66",
    "keyring>=25; sys_platform == 'win32'",
    "protobuf>=5.28",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
fleet-agent = "fleet_agent.__main__:main"
fleet-hub = "fleet_hub.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/fleet_agent", "hub/fleet_hub", "shared/fleet_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["agent", "hub", "shared", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
