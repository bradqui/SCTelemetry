name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # Integrations may import the shared models on Python 3.11.
  shared-py311:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run --python 3.11 --with "pydantic>=2.8" python -c "import sys; sys.path.insert(0, 'shared'); import starglance_shared; print(starglance_shared.SCHEMA_VERSION)"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Not `npm ci`: a lockfile made on Windows lacks some Linux-only optional deps
      # (Vite's native bundler bindings), which `npm ci` treats as out of sync.
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  # The hub's image (deploy/docker-compose.yml builds the same thing on the server).
  hub-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f hub/Dockerfile -t starglance-hub:ci .
      - name: Start it and check it answers
        run: |
          docker run -d --name hub -p 127.0.0.1:8100:8100 -e HUB_DEV_LOGIN=1 starglance-hub:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8100/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8100/api/mode
          curl -fs http://127.0.0.1:8100/ | grep -q '<div id="app">'
          docker logs hub 2>&1 | tee /dev/stderr | grep -q 'No admin yet'
      - name: A data folder owned by root (a host folder mounted at /data) still works
        run: |
          mkdir -p "$RUNNER_TEMP/hubdata" && sudo chown root:root "$RUNNER_TEMP/hubdata"
          docker run -d --name hub2 -p 127.0.0.1:8101:8100 -e HUB_DEV_LOGIN=1 \
            -v "$RUNNER_TEMP/hubdata:/data" starglance-hub:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8101/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8101/api/health
          # The hub itself runs as its own user, not root.
          docker exec hub2 grep '^Uid:' /proc/1/status | tee /dev/stderr | grep -qw 10001
          sudo test -f "$RUNNER_TEMP/hubdata/hub.sqlite3"
          stat -c '%u' "$RUNNER_TEMP/hubdata/hub.sqlite3" | grep -qx 10001
