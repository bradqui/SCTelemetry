[project]
name = "starglance"
version = "0.9.0"
description = "Starglance: Star Citizen ship and crew status. Windows agent, self-hosted hub, and tools"
readme = "README.md"
# The agent and hub target 3.12; the shared models also run on 3.11 (for integrations).
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10",
    "grpcio>=1.66",
    "grpcio-reflection>=1.66",
    "keyring>=25; sys_platform == 'win32'",
    "protobuf>=5.28",
    "pydantic>=2.8",
    "truststore>=0.10; sys_platform == 'win32'",
    "zstandard>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
starglance = "starglance.__main__:main"
starglance-hub = "starglance_hub.__main__:main"

[project.optional-dependencies]
app = [
    "pillow>=10.4 ; sys_platform == 'win32'",
    "pystray>=0.19 ; sys_platform == 'win32'",
    "pywebview>=5.3 ; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/starglance", "hub/starglance_hub", "shared/starglance_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["agent", "hub", "shared", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
