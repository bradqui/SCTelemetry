# The fleet hub (see deploy/README.md).
#
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
#   docker compose logs hub   # the first time: the link that creates the admin account
#
# The port is published on 127.0.0.1 only: put a reverse proxy with https in front
# (Caddy, nginx, Apache; examples in deploy/README.md).

services:
  hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    image: fleet-telemetry-hub:latest
    container_name: fleet-hub
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - hub-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hub-data:
